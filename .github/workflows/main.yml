name: Paradise Dance Academy - CI & Quality Gates

on:
  push:
    branches: [ main, develop, RamaKev ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_ENV: production
  CI: true

jobs:
  code-quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necesario para SonarQube
    
    - name: 📦 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: 📦 Install Dependencies
      run: |
        npm ci --prefer-offline --no-audit
        npm install --save-dev eslint eslint-config-next
    
    - name: 🔍 ESLint Analysis
      run: |
        echo "🔍 Running ESLint..."
        npm run lint
    
    - name: 🔧 TypeScript Type Check
      run: |
        echo "🔧 Checking TypeScript types..."
        npm run type-check
      continue-on-error: true
    
    - name: 🗄️ Generate Prisma Client
      run: |
        echo "🗄️ Generating Prisma client..."
        npm run db:generate
      continue-on-error: true
    
    - name: 🧪 Run Tests with Coverage
      run: |
        echo "🧪 Running test suite with coverage..."
        npm run test:ci
      env:
        NODE_ENV: test
      continue-on-error: true
    
    - name: 🏗️ Build Verification
      run: |
        echo "🏗️ Verifying build process..."
        echo "DATABASE_URL=postgresql://user:pass@localhost:5432/testdb" > .env.local
        echo "NEXTAUTH_SECRET=test-secret-minimum-32-characters-long-for-ci" >> .env.local
        echo "NEXTAUTH_URL=http://localhost:3000" >> .env.local
        npm run build
      continue-on-error: true

  sonarqube-analysis:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necesario para análisis completo
    
    - name: 📦 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: 📦 Install Dependencies
      run: npm ci --prefer-offline --no-audit
    
    - name: 🧪 Generate Test Coverage
      run: |
        echo "🧪 Generating test coverage for SonarQube..."
        npm run test:ci
      env:
        NODE_ENV: test
      continue-on-error: true
    
    - name: 🔍 SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.2.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-audit:
    name: Security & Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 📦 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: 📦 Install Dependencies
      run: npm ci --prefer-offline --no-audit
    
    - name: 🔒 Security Vulnerability Scan
      run: |
        echo "🔒 Running npm security audit..."
        npm audit --audit-level moderate || echo "⚠️ Security vulnerabilities found - review required"
      continue-on-error: true
    
    - name: 📋 License Compliance
      run: |
        echo "📋 Checking license compliance..."
        npx license-checker --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;Unlicense" || echo "⚠️ License review required"
      continue-on-error: true
    
    - name: 🛡️ Dependency Review (PR only)
      uses: actions/dependency-review-action@v3
      if: github.event_name == 'pull_request'

  pipeline-summary:
    name: Pipeline Results
    needs: [code-quality, sonarqube-analysis, security-audit]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📊 Quality Summary
      run: |
        echo "🎯 Paradise Dance Academy - Quality Analysis Complete"
        echo "=================================================="
        echo ""
        echo "📋 Pipeline Results:"
        echo "  Code Quality & Testing: ${{ needs.code-quality.result }}"
        echo "  SonarQube Analysis: ${{ needs.sonarqube-analysis.result }}"
        echo "  Security Audit: ${{ needs.security-audit.result }}"
        echo ""
        
        if [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "✅ Code quality checks passed!"
        else
          echo "❌ Code quality issues detected"
        fi
        
        if [ "${{ needs.sonarqube-analysis.result }}" == "success" ]; then
          echo "✅ SonarQube quality gate passed!"
        else
          echo "❌ SonarQube quality gate failed - Configure SonarCloud first"
        fi
        
        if [ "${{ needs.security-audit.result }}" == "success" ]; then
          echo "✅ Security audit completed!"
        else
          echo "⚠️ Security review required"
        fi
        
        echo ""
        echo "🔗 Review detailed results in SonarQube dashboard"
        echo "📈 Code coverage and quality metrics available in SonarQube"
        echo ""
        echo "🚀 Ready for deployment when quality gates pass!" 