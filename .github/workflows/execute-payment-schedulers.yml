name: Execute Payment Schedulers

on:
  schedule:
    # Ejecutar solo los días 1 y 16 de cada mes
    # Día 1: Para schedulers de corte 30 (que se ejecutan el día 1)
    # Día 16: Para schedulers de corte 15 (que se ejecutan el día 16)
    # Se ejecuta cada hora en esos días para cubrir diferentes horarios de schedulers
    - cron: '0 */1 1,16 * *'  # Cada hora en los días 1 y 16 del mes
  workflow_dispatch: # Permitir ejecución manual

jobs:
  execute-payment-schedulers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute Payment Schedulers
        run: |
          echo "🚀 Iniciando ejecución de schedulers de pago..."
          echo "📡 URL: ${{ secrets.RAILWAY_PUBLIC_DOMAIN }}/api/cron/execute-payment-schedulers"
          echo "🕐 Hora actual: $(date)"
          
          response=$(curl -s -w "\n%{http_code}" -X GET "${{ secrets.RAILWAY_PUBLIC_DOMAIN }}/api/cron/execute-payment-schedulers" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "📊 Status Code: $http_code"
          echo "📄 Response: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Ejecución de schedulers completada exitosamente"
            echo ""
            echo "📄 Respuesta completa:"
            echo "$body" | jq '.'
            
            # Extraer resumen de resultados
            executed=$(echo "$body" | jq -r '.summary.executed // 0')
            total_sent=$(echo "$body" | jq -r '.summary.totalSent // 0')
            total_failed=$(echo "$body" | jq -r '.summary.totalFailed // 0')
            total_processed=$(echo "$body" | jq -r '.summary.totalProcessed // 0')
            active_schedulers=$(echo "$body" | jq -r '.summary.activeSchedulers // 0')
            schedulers_to_execute=$(echo "$body" | jq -r '.summary.schedulersToExecute // 0')
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 RESUMEN DE EJECUCIÓN"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 Schedulers activos en el sistema: $active_schedulers"
            echo "⚡ Schedulers programados para ejecutarse: $schedulers_to_execute"
            echo "🚀 Schedulers ejecutados: $executed"
            echo ""
            echo "📨 MENSAJES:"
            echo "   ✅ Enviados exitosamente: $total_sent"
            echo "   ❌ No se pudieron enviar: $total_failed"
            echo "   📈 Total procesados: $total_processed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Mostrar detalles de cada scheduler ejecutado
            if [ "$executed" -gt 0 ]; then
              echo ""
              echo "📋 DETALLES POR SCHEDULER:"
              echo "$body" | jq -r '.results[] | "   • \(.schedulerName) (ID: \(.schedulerId)):\n     - Estado: \(.status)\n     - Enviados: \(.sent // 0)\n     - Fallidos: \(.failed // 0)\n     - Total: \(.total // 0)"'
              
              # Mostrar errores si los hay
              errors=$(echo "$body" | jq -r '.results[] | select(.error != null) | "   ⚠️  \(.schedulerName): \(.error)"')
              if [ -n "$errors" ]; then
                echo ""
                echo "⚠️  ERRORES ENCONTRADOS:"
                echo "$errors"
              fi
            else
              echo ""
              echo "ℹ️  No había schedulers programados para ejecutarse en este momento"
              echo "   (Verifica que el día del mes y la hora coincidan con la configuración)"
            fi
          else
            echo "❌ Error en la ejecución de schedulers"
            echo "$body"
            exit 1
          fi

