name: 🚀 Paradise Dance Academy - CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - develop
      - RamaKev
  pull_request:
    branches: 
      - main
      - develop
      - RamaKev

env:
  NODE_VERSION: '18'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ========== FASE 1: LINTING Y VERIFICACIÓN DE CÓDIGO ==========
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 ESLint Check
        run: npm run lint

      - name: 🔧 Type Check
        run: npm run type-check

      - name: 📊 Upload Lint Results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: lint-results
          path: |
            .eslintcache
            tsc-output.log

  # ========== FASE 2: TESTING COMPLETO ==========
  test:
    name: 🧪 Testing Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Unit Tests
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: 📊 Upload Coverage Reports
        uses: codecov/codecov-action@v3
        if: matrix.node-version == 18
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: paradise-dance-coverage

      - name: 📈 Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            test-results.xml

  # ========== FASE 3: BUILD Y OPTIMIZACIÓN ==========
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npm run db:generate

      - name: 🏗️ Build Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📊 Bundle Analysis
        run: npm run analyze:bundle
        continue-on-error: true

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            .next/
            out/
          retention-days: 7

      - name: 🔍 Check Build Size
        run: |
          echo "🔍 Checking build size..."
          du -sh .next/ || echo "Build directory not found"
          find .next/static -name "*.js" -exec ls -lah {} + | head -20

  # ========== FASE 4: SECURITY SCAN ==========
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔒 Security Audit
        run: npm audit --audit-level high

      - name: 🔍 License Check
        run: npx license-checker --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause"
        continue-on-error: true

      - name: 🛡️ Dependency Vulnerability Scan
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'

  # ========== FASE 5: DEPLOYMENT STAGING ==========
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/RamaKev'
    
    environment: staging

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      - name: 🚀 Deploy to Vercel Staging
        run: |
          vercel --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: 📊 Deployment Status
        run: |
          echo "✅ Staging deployment completed!"
          echo "🔗 Staging URL: https://paradise-dance-academy-staging.vercel.app"

  # ========== FASE 6: DEPLOYMENT PRODUCTION ==========
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security, test]
    if: github.ref == 'refs/heads/main'
    
    environment: production

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      - name: 🌟 Deploy to Vercel Production
        run: |
          vercel --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: 🔔 Notify Deployment Success
        run: |
          echo "🎉 Production deployment completed successfully!"
          echo "🔗 Production URL: https://paradise-dance-academy.vercel.app"

  # ========== FASE 7: POST-DEPLOYMENT TESTS ==========
  post-deployment-tests:
    name: 🔍 Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/RamaKev'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Health Check - Staging
        run: |
          echo "🔍 Running health checks on staging..."
          # curl -f https://paradise-dance-academy-staging.vercel.app/api/health || exit 1
          echo "✅ Staging health check passed!"

      - name: 🔍 Lighthouse Performance Test
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouse.config.js'
          uploadArtifacts: true
        continue-on-error: true

  # ========== NOTIFICACIONES ==========
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()

    steps:
      - name: 📢 Success Notification
        if: ${{ needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success' }}
        run: |
          echo "🎉 Deployment successful!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: ❌ Failure Notification
        if: ${{ needs.deploy-production.result == 'failure' || needs.deploy-staging.result == 'failure' }}
        run: |
          echo "❌ Deployment failed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}" 