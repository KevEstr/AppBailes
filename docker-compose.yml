version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: paradise_dance_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/paradise_dance_academy?connection_limit=10&pool_timeout=20&connect_timeout=10"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "desarrollo_local_secret_cambiar_en_produccion"
      NODE_ENV: "development"
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma
    command: |
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node server.js
      "

volumes:
  postgres_data: 