# SonarQube Configuration for Paradise Dance Academy
sonar.projectKey=paradise-dance-academy
sonar.organization=your-org
sonar.projectName=Paradise Dance Academy
sonar.projectVersion=1.0

# Source code
sonar.sources=app,components,lib,hooks
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**

# Tests
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Language
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Quality Gates
sonar.qualitygate.wait=true 