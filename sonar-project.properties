# SonarQube Configuration - Paradise Dance Academy
# REEMPLAZA estos valores con los de tu SonarCloud:
sonar.projectKey=KevEstr_AppBailes
sonar.organization=kevestr

sonar.projectName=Paradise Dance Academy
sonar.projectVersion=1.0

# Source code directories
sonar.sources=app,components,lib,hooks,contexts,types
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/out/**,**/*.config.js,**/*.config.mjs,**/*.config.ts

# Test directories
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Language settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gates
sonar.qualitygate.wait=true

# Code Coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.config.js,**/*.config.mjs,**/*.d.ts,**/types/**

# Duplications
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx

# Analysis settings
sonar.sourceEncoding=UTF-8

# Security settings
sonar.security.hotspots.inheritFromParent=true 
